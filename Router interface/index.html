<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Router interface</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="icons/router_os_logo-removebg-preview.png" alt="router" class="logo"> 
        <br>
        <div class="menu-pos">
            <div class="menu" style="display: none;" id="menu">
                <a onclick="Goto('home')"><img src="icons/home_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.png" alt=""></a>
                <a onclick="Goto('settings')"><img src="icons/settings_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.png" alt=""></a>
                <a onclick="Goto('reboot')"><img src="icons/restart_alt_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.png" alt=""></a>
            </div>    
        </div>  
    </header>

    <div class="main">
        <div class="card">
            <div class="login" id="login">
                <br>
                <h2>Login</h2>
                <form onsubmit="login(event)">
                        <label>
                            <p>Username:</p>
                            <input type="text" name="username" id="username" required placeholder="Username...">
                        </label>

                        <label>
                            <p>Password:</p>
                            <input type="password" name="password" id="pw" required placeholder="Password...">
                        </label><br><br>
                        <button id="btn-enter" type="submit">Submit</button>
                </form>
            </div>

            <div id="settings" class="settings" style="display: none;">
                <h1>Devices:</h1>
                <div id="mac-ban"></div>
                <hr>
                <h2>Name & Password change (WLAN)</h2>
                <form onsubmit="updateWLAN(event)">
                    <input type="text" id="wlan-name" required placeholder="Name...">
                    <input type="password" id="wlan-password" required placeholder="Password...">
                    <br><br>
                    <button type="submit">Save</button>
                </form>
                <hr>
                <h3>Open Port:</h3>
                <input type="number" id="port" placeholder="Open Port...">
                <br><br>
                <button id="btn-port">Open</button>
                <h4>Open PORT:</h4>
                <span id="open-port"></span>
            </div>
            
            <div id="home" class="home" style="display: none;">
                <h1>CPU:</h1>
                <p><span id="cpu">0%</span></p>
                <hr>
                <h2>UPTIME:</h2>
                <p><span id="uptime">0</span></p>
            </div>

            <div id="reboot" class="reboot" style="display: none; text-align: center;">
                <h1>Reboot?</h1>
                <button id="btn-reboot">Reboot</button>
            </div>
        </div>
    </div>
    <footer>
        <a href="https://github.com/Conbox30/"><img src="icons/github.png" class="github" alt="Github icon"> Conbox30</a>
        <p>Made by Conbox30 aka Alexander Ziegler.</p>
    </footer>
    <script src="main.js"></script>
</body>
</html>
